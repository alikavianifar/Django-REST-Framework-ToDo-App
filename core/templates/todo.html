{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/todo.css' %}">
</head>

<body>
    <!-- Navigation Bar -->
    {% include 'includes/navbar.html' %}

    <!-- Main Content -->
    <div class="container-fluid">
        <div class="row">

            <!-- Task Forms -->
            {% include 'includes/task_form.html' %}

            <div class="col-md-8">
                <div class="row">
                    <div class="col-12 mb-3">
                        <div class="card p-2">
                            <div class="d-flex justify-content-end align-items-center">

                                <!-- Completed Link -->
                                <span class="text-white">Completed</span><a class="btn btn-link  completed" data-bs-toggle="offcanvas" href="#offcanvasExample"
                                    role="button" aria-controls="offcanvasExample">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor"
                                        class="bi bi-archive-fill" viewBox="0 0 16 16">
                                        <path
                                            d="M12.643 15C13.979 15 15 13.845 15 12.5V5H1v7.5C1 13.845 2.021 15 3.357 15zM5.5 7h5a.5.5 0 0 1 0 1h-5a.5.5 0 0 1 0-1M.8 1a.8.8 0 0 0-.8.8V3a.8.8 0 0 0 .8.8h14.4A.8.8 0 0 0 16 3V1.8a.8.8 0 0 0-.8-.8z" />
                                    </svg>
                                </a>

                                <!-- Completed List -->
                                {% include 'includes/completed_tasks.html' %}

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Task List -->
                {% include 'includes/task_list.html' %}

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
