{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/todo.css' %}">
</head>

<body>
    <div class="container-fluid mt-5 pt-5">
        <div class="row justify-content-center mt-5">
            <div class="col-md-4">
                <div class="card p-4">

                    <h1 class="text-light text-center mb-4">Login</h1>
                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-warning" role="alert">{{ message }}</div>
                    {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="title" class="form-label text-light">Email</label>
                            <input type="email" name="username" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label for="due_date" class="form-label text-light">Password</label>
                            <input type="password" name="password" class="form-control">
                        </div>

                        <button type="submit" class="btn btn-success w-100">Login</button>
                    </form>
                    <p class="mt-3 text-light">Don’t have an account? <a style="text-decoration: none; color: #198754;" href="{% url 'accounts:signup' %}">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
