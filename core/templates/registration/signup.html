{% load static %}
{% load humanize %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/todo.css' %}">
</head>

<body>
    <div class="container-fluid mt-5 pt-4">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card p-4">

                    <h1 class="text-light text-center mb-4">Signup</h1>
                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-info" role="alert">{{ message }}</div>
                    {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="email" class="form-label text-light">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label text-light">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password1" class="form-label text-light">Password</label>
                            <input type="password" name="password1" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="password2" class="form-label text-light">Password confirmation</label>
                            <input type="password" name="password2" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Signup</button>
                    </form>
                    <p class="mt-3 text-light">Already have an account?
                        <a style="text-decoration: none; color: #198754;" href="{% url 'accounts:login' %}">Login</a>
                    </p>

                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
